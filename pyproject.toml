[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "system-monitoring"
version = "1.0.0"
description = "Automated log extraction tool for Arch Linux system monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "systemd-python>=235",
    "docker>=7.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
system-monitoring = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "N",
    "ARG",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
